<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Okwoli Joshua — Software Engineer</title>

  <!-- Resolve the theme before first paint. Inline and synchronous on purpose:
       any async path here shows a flash of the wrong theme. -->
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('oj-theme-v3'); } catch (e) { }
      var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.dataset.theme = stored || (prefersLight ? 'light' : 'dark');
      /* Confirms scripting BEFORE first paint, which is what hides the static
         copy of the page at the bottom of <body>. A crawler that does not run
         this never sets the flag, so it reads the content instead of a blank
         div — see plugins/seo.js. */
      document.documentElement.dataset.js = 'on';
    })();
  </script>
  <meta name="theme-color" content="#05060a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)" />
  <meta name="description"
    content="Interactive 3D laptop hero — React Three Fiber, spring-driven interaction, GSAP scroll docking." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@300;400;500&family=Space+Grotesk:wght@300..700&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
